[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rowproof-agent-harness"
version = "0.1.0"
description = "A contract-driven data-processing agent harness with independent verification."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.8,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
rowproof = "rowproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rowproof = ["assets/*.csv", "assets/*.json", "assets/*.py.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["runs", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
